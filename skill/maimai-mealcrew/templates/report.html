<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #6b7280; --line: #e5e7eb;
    --accent: #da291c; --band: #fff5f3; --pay: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .summary {
    background: var(--band); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  thead th { background: #fafafa; color: var(--muted); font-weight: 600; }
  td.pay, th:last-child { color: var(--pay); font-weight: 700; }
  .disclaimer { color: var(--muted); font-size: 12px; margin-top: 24px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .source-badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; margin-bottom: 14px; }
  .source-badge.official { background: #ecfdf3; color: #047857; border: 1px solid #a7f3d0; }
  .source-badge.demo { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
  @media print { body { padding: 12px; } .summary { break-inside: avoid; } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>{{TITLE}}</h1>
    <div class="meta">会话：{{GENERATED_AT}} ｜ 结算模式：{{MODE}}</div>
    <div class="source-badge">{{SOURCE_BADGE}}</div>
    <div class="summary">
      <strong>{{PAYABLE_LABEL}}：{{OFFICIAL_PAYABLE}}</strong><br />
      {{SUMMARY}}
    </div>
    {{BILL_TABLE}}
    <div class="disclaimer">{{DISCLAIMER}}</div>
  </div>
</body>
</html>
